<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — The Great Thanksgiving Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141824; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Run: a turkey escaping Thanksgiving. Press space to jump, again in mid-air to flap, down arrow to duck. Reach the Freedom Gate at 1200 metres before the farmer catches you."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
